<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Plus · Boshqaruv</title>
<style>
:root{
  --bg:#f4f7fc; --card:#fff; --ink:#1b2440; --muted:#6b7591; --line:#e6ebf4;
  --blue:#2f7cf6; --violet:#6a4bff; --green:#12b76a; --red:#f04438; --orange:#f79009; --yellow:#fdb022; --teal:#06aed4; --pink:#ee46bc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(27,36,64,.06)}
.hw{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:21px;color:#1d6ff2;margin-right:auto;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;background:#eef3fc;padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:9px;font-weight:600}
.tabs button.on{background:#1d6ff2;color:#fff;box-shadow:0 2px 8px rgba(29,111,242,.3)}
.hw > a{color:var(--muted);font-size:13px;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 16px}
.bar h1{font-size:22px;margin:0 auto 0 0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--blue),var(--violet))}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(27,36,64,.06);border:1px solid var(--line)}
.kpi{position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--blue))}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
h2{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .pill{font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:12px;background:#eef2ff;color:var(--violet)}
.pill.red{background:#fee4e2;color:#b42318}.pill.green{background:#dcfae6;color:#067647}.pill.orange{background:#fef0c7;color:#b54708}.pill.blue{background:#d1e9ff;color:#175cd3}.pill.gray{background:#eef1f6;color:#5d6b82}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.more{margin-top:8px}
.chart{width:100%;height:240px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)} .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{background:#fff8e6;border:1px solid #fde7a8;border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
.err{background:#fee4e2;border:1px solid #fecdca;color:#b42318;border-radius:12px;padding:10px 14px;margin:10px 0}
.sellers{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.seller{cursor:pointer;transition:transform .1s}.seller:hover{transform:translateY(-2px)}
.seller .nm{font-weight:800;font-size:17px}
.seg{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eef1f6;margin:10px 0 6px}
.seg span{display:block;height:100%}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:76px;padding:6px;font-size:12px;cursor:pointer}
.cal .d.t{outline:2px solid var(--violet)} .cal .d.e{background:transparent;border:0;cursor:default}
.cal .d b{font-size:13px}
.inc{color:var(--green);font-weight:700}.due{color:var(--orange);font-weight:700}
.sub{display:none;background:#f8faff}.sub.open{display:table-row}
.clk{cursor:pointer}.clk:hover{background:#f8faff}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:0;margin-bottom:8px}
.go{cursor:pointer;transition:transform .12s,box-shadow .12s}.go:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(29,111,242,.14)}
.kpi .hint{position:absolute;top:10px;right:12px;font-size:12px;color:#9aa4bd}
.ms{color:#1d6ff2;text-decoration:none;font-weight:600;white-space:nowrap}.ms:hover{text-decoration:underline}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dashed #9db8ec}a.lnk:hover{color:#1d6ff2}
h2 .ms{font-size:13px}.src{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.lead{display:grid;gap:10px}
.ld{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.ld .rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#eef3fc;color:#1d6ff2}
.ld .rk.g1{background:#ffd54a;color:#7a5200}.ld .rk.g2{background:#d9e1ee;color:#3d4a63}.ld .rk.g3{background:#ffc9a3;color:#8a3d00}
.ld .nm{font-weight:800}.ld .bar2{height:8px;border-radius:5px;background:#eef3fc;margin-top:6px;overflow:hidden}
.ld .bar2 span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#1d6ff2,#6a4bff)}
.ld .sm{font-size:20px;font-weight:800;text-align:right}
#mod{position:fixed;inset:0;background:rgba(20,30,60,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#mod.open{display:flex}
#mod .box{background:#fff;border-radius:18px;max-width:980px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#mod .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}#mod .mh h3{margin:0 auto 0 0;font-size:19px}
#mod .x{border:0;background:#eef3fc;border-radius:10px;width:34px;height:34px;font-size:18px}
.mini{display:flex;align-items:flex-end;gap:3px;height:90px;margin:8px 0 2px}.mini span{flex:1;background:linear-gradient(#6a4bff,#1d6ff2);border-radius:3px 3px 0 0;min-height:2px}
@media (max-width:640px){.kpi .v{font-size:21px}.cal .d{min-height:58px;font-size:10px}.hw{padding:10px 12px}.wrap{padding:14px 12px 50px}}
</style>
</head>
<body>
<header><div class="hw">
  <div class="brand">Spark Plus</div>
  <div class="tabs"><button data-t="daily" class="on">Kunlik nazorat</button><button data-t="nasiya">Nasiya</button></div>
  <a href="/logout">Chiqish</a>
</div></header>
<div class="wrap" id="app"><p class="muted">Yuklanmoqda…</p></div>
<div id="mod" onclick="if(event.target===this)closeM()"><div class="box"><div class="mh"><h3 id="mt"></h3><button class="x" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const f=x=>(Math.round(x||0)).toLocaleString('ru-RU').replace(/ /g,' ');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'—';
let TAB='daily', D=null, N=null, LV=null, CURM=null, NV={view:'home'}, calMonth=null;
/* MoySklad havolalari */
const MSU='https://online.moysklad.ru/app/#';
const PT={product:'good',variant:'feature',service:'service',bundle:'bundle'};
const uz=d=>d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(0,4);
const msDoc=(k,id)=>id?MSU+k+'/edit?id='+id:null;
const msProd=(t,id)=>id?MSU+(PT[t]||'good')+'/edit?id='+id:null;
const msCo=id=>id?MSU+'company/edit?id='+id:null;
const msList=(k,d1,d2)=>MSU+k+'?global_periodFilter='+encodeURIComponent(uz(d1)+' 00:00:00,'+uz(d2||d1)+' 23:59:59');
const L=(u,t)=>u?`<a class="lnk" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t}</a>`:t;
const MS=(u,t='MoySklad ↗')=>u?`<a class="ms" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t}</a>`:'';
const SRC=(txt,u)=>`<div class="src">Manba: ${txt} ${MS(u,'· MoySklad\'da ochish ↗')}</div>`;
const KN={demand:'Отгрузки',salesreturn:'Возвраты покупателей',cashin:'Приходные ордера',cashout:'Расходные ордера',paymentin:'Входящие платежи',paymentout:'Исходящие платежи',supply:'Приёмки',loss:'Списания',enter:'Оприходования'};
const PN=x=>L(msProd(x.t,x.id),esc(x.name))+' <span class="muted small">'+esc(x.code)+'</span>';
function openM(t,h){$('#mt').innerHTML=t;$('#mb').innerHTML=h;$('#mod').classList.add('open');document.body.style.overflow='hidden';}
function closeM(){$('#mod').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
const docCols=k=>[{h:'Hujjat',f:x=>L(msDoc(k,x.id),'<b>'+esc(x.doc)+'</b>')},{h:'Vaqt',k:'time'},{h:'Kontragent',f:x=>L(msCo(x.aid),esc(x.client))},{h:'Xodim',k:'who'},{h:'Summa',n:1,f:x=>f(x.sum)},{h:'Izoh',f:x=>'<span class="small">'+esc(x.note)+'</span>'}];

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  TAB=b.dataset.t; render();
});

async function getJ(u){const r=await fetch(u); if(r.status===401){location='/login';return null} return r.json();}
async function load(){
  [D,N,LV]=await Promise.all([getJ('api/daily'),getJ('api/nasiya'),getJ('api/live')]); render();
}
function render(){ TAB==='daily'?renderDaily():renderNasiya(); }

function delta(a,b,inv){ if(!b) return ''; const p=(a-b)/Math.abs(b)*100; const good=inv?p<=0:p>=0;
  return `<span class="${good?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span> <span class="muted small">7 kun o'rtachasiga nisbatan</span>`;}

function table(cols,rows,lim=10,id,click){
  if(!rows||!rows.length) return '<div class="muted small">Yo\'q</div>';
  id=id||('t'+Math.random().toString(36).slice(2));
  const head='<tr>'+cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('')+'</tr>';
  if(click) window['rc_'+id]=i=>click(rows[i]);
  const body=rows.map((r,i)=>`<tr class="${i>=lim?'hid-'+id:''} ${click?'clk':''}" style="${i>=lim?'display:none':''}" ${click?`onclick="rc_${id}(${i})"`:''}>`+cols.map(c=>`<td class="${c.n?'n':''}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')+'</tr>').join('');
  const more=rows.length>lim?`<button class="btn light more" onclick="document.querySelectorAll('.hid-${id}').forEach(e=>e.style.display='');this.remove()">Hammasini ko'rsatish (${rows.length})</button>`:'';
  return `<div class="tw"><table>${head}${body}</table></div>${more}`;
}

function chart(series){
  const W=1000,H=240,P=34, n=series.length, mx=Math.max(...series.map(s=>s.sales),1);
  const bw=(W-P*2)/n;
  let bars='',line='',labels='';
  series.forEach((s,i)=>{const x=P+i*bw, h=(s.sales/mx)*(H-P-20), y=H-P-h;
    bars+=`<rect x="${x+2}" y="${y}" width="${bw-4}" height="${h}" rx="4" fill="url(#g)" style="cursor:pointer" onclick="dayM(${i})"><title>${dd(s.day)}: savdo ${f(s.sales)}, foyda ${f(s.profit)}</title></rect>`;
    const py=H-P-(s.profit/mx)*(H-P-20); line+=(i?'L':'M')+(x+bw/2)+' '+py;
    if(i%3===0||i===n-1) labels+=`<text x="${x+bw/2}" y="${H-12}" font-size="12" text-anchor="middle" fill="#6b7591">${dd(s.day)}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6a4bff"/><stop offset="1" stop-color="#2f7cf6"/></linearGradient></defs>${bars}<path d="${line}" fill="none" stroke="#12b76a" stroke-width="3"/>${labels}</svg>
  <div class="legend"><span><b style="background:#4f63fb"></b>Savdo</span><span><b style="background:#12b76a"></b>Foyda</span><span>Eng yuqori kun: ${f(mx)} so'm</span></div>`;
}

const SD=w=>w==='L'?LV.data:D.report;
function kcard(c,l,v,sub,fn){return `<div class="card kpi go" style="--c:var(--${c})" onclick="${fn}"><span class="hint">ochish ›</span><div class="l">${l}</div><div class="v">${v}</div><div class="small">${sub}</div></div>`;}
function renderDaily(){
  const app=$('#app');
  if(!D){app.innerHTML='<p class="muted">Yuklanmoqda…</p>';return}
  const r=D.report;
  let top=`<div class="bar"><h1>Kunlik nazorat${r?' · '+dd(r.day)+'.'+r.day.slice(0,4):''}</h1>
    <span class="muted small">${r?'Hisoblangan: '+r.built:''}</span>
    <button class="btn" id="rerun">${D.running?'Hisoblanmoqda…':'Qayta hisoblash'}</button></div>`;
  if(D.error) top+=`<div class="err">Xato: ${esc(D.error)}</div>`;
  const Lv=LV&&LV.data;
  if(!r&&!Lv){app.innerHTML=top+'<div class="note">Hisobot tayyorlanmoqda. Birinchi marta 3–6 daqiqa ketadi, sahifa o\'zi yangilanadi.</div>';bindRerun();return}
  const M=(Lv&&Lv.month)||(r&&r.month); CURM=M;
  let h=top;
  if(M){
    const mx=Math.max(...M.employees.map(e=>e.sales),1);
    h+=`<h2 style="margin-top:6px">Oylik reyting · ${dd(M.from)} – ${dd(M.to)} <span class="pill blue">kim ko'p sotyapti</span>${M.live?` <span class="pill green">● jonli · ${Lv.at} · har 5 daqiqada</span>`:''}</h2>
    <div class="grid k4">
      ${kcard('blue','Oylik savdo',f(M.sales),'<span class="muted">'+M.count+' ta sotuv</span>',"monthM()")}
      ${kcard('green','Oylik foyda',f(M.profit),'<span class="muted">marja '+M.margin+'%</span>',"monthM()")}
      ${kcard('orange','Oylik qaytarish',f(M.returns),'<span class="muted">savdoning '+(M.sales?(M.returns/M.sales*100).toFixed(1):0)+'%</span>',"monthM()")}
    </div>
    <div class="lead" style="margin-top:14px">${M.employees.filter(e=>e.sales||e.returns).map((e,i)=>`<div class="card ld go" onclick="empM(${i})">
      <div class="rk ${i<3?'g'+(i+1):''}">${i+1}</div>
      <div><div class="nm">${esc(e.name)}</div><div class="small muted">${e.count} ta sotuv · foyda ${f(e.profit)} · marja ${e.margin}% · ulushi ${M.sales?(e.sales/M.sales*100).toFixed(1):0}%</div>
      <div class="bar2"><span style="width:${e.sales/mx*100}%"></span></div></div>
      <div class="sm">${f(e.sales)}<div class="small muted" style="font-weight:600">so'm ›</div></div></div>`).join('')}</div>
    ${SRC('MoySklad → Прибыльность → по сотрудникам, '+uz(M.from)+' – '+uz(M.to),msList('demand',M.from,M.to))}`;
  }
  if(Lv){const t=Lv.kpi;
    h+=`<h2>Bugun · ${uz(Lv.day)} <span class="pill green">● ${Lv.at} holatiga</span></h2><div class="grid k4">
    ${kcard('blue','Bugungi savdo',f(t.sales),'<span class="muted">'+t.count+' ta sotuv</span>',"salesM('L')")}
    ${kcard('green','Bugungi foyda',f(t.profit),'<span class="muted">marja '+t.margin+'%</span>',"salesM('L')")}
    ${kcard('orange','Bugungi qaytarish',f(t.returns),'<span class="muted">'+(Lv.docs.salesreturn||[]).length+' ta hujjat</span>',"docsM('salesreturn','L')")}
    ${kcard('teal','Bugungi kassa + bank kirim',f([...(Lv.docs.cashin||[]),...(Lv.docs.paymentin||[])].reduce((a,x)=>a+x.sum,0)),'<span class="muted">pul tushumi</span>',"incomeM()")}
    </div>
    <div class="card" style="margin-top:14px">${table([{h:'Xodim',k:'name'},{h:'Savdo',n:1,f:x=>'<b>'+f(x.sales)+'</b>'},{h:'Foyda',n:1,f:x=>f(x.profit)},{h:'Marja',n:1,f:x=>x.margin+'%'},{h:'Sotuvlar',n:1,k:'count'},{h:'Qaytarish',n:1,f:x=>f(x.returns)}],Lv.employees,20,'lemp',x=>whoM(x.name,'L'))}
    ${SRC('MoySklad → Прибыльность → по сотрудникам, bugun '+Lv.at+' holatiga',msList('demand',Lv.day))}</div>`;
  }
  if(!r){app.innerHTML=h+'<div class="note">Kechagi to\'liq hisobot (ombor tahlili, grafik) tayyorlanmoqda…</div>';bindRerun();return}
  const k=r.kpi;
  h+=`<h2>Kecha · ${uz(r.day)}</h2><div class="grid k4">
    ${kcard('blue','Savdo',f(k.sales),delta(k.sales,k.sales7),"salesM()")}
    ${kcard('green','Foyda',f(k.profit),delta(k.profit,k.profit7),"salesM()")}
    ${kcard('violet','Marja',k.margin+'%','<span class="muted">7 kunda: '+k.margin7+'%</span>',"salesM()")}
    ${kcard('orange','Qaytarishlar',f(k.returns),delta(k.returns,k.returns7,true),"docsM('salesreturn')")}
  </div>
  <div class="grid k4" style="margin-top:14px">
    ${kcard('red','Ziyonga sotuv',f(r.loss_total),'<span class="muted">'+r.loss_sales.length+' ta tovar</span>',"listM('loss')")}
    ${kcard('teal','Qarzga sotildi (kecha)',f(r.credit_total),'<span class="muted">'+r.credit.length+' ta otgruzka</span>',"listM('credit')")}
    ${kcard('pink','Umumiy mijoz qarzi',f(r.debt_total),'<span class="muted">Muddati o\'tgan: '+f(r.overdue_total)+'</span>',"listM('debt')")}
    ${kcard('yellow','O\'lik zaxira (60 kun)',f(r.dead_value),'<span class="muted">'+r.dead_n+' ta tovar</span>',"listM('dead')")}
  </div>
  <div class="small muted" style="margin-top:6px">Har bir kartani, qatorni yoki grafik ustunini bosing: ichida nimadan tashkil topgani va MoySklad'dagi manbasi chiqadi. Summalar so'mda.</div>
  <h2>30 kunlik savdo <span class="muted small">ustunni bosing</span></h2><div class="card">${chart(r.series)}${SRC('MoySklad → Прибыльность (har kun alohida)',msList('demand',r.series[0].day,r.day))}</div>
  <h2>Xodimlar · kecha <span class="muted small">qatorni bosing</span></h2><div class="card">${table([
    {h:'Xodim',k:'name'},{h:'Savdo',n:1,f:x=>f(x.sales)},{h:'Foyda',n:1,f:x=>f(x.profit)},{h:'Marja',n:1,f:x=>x.margin+'%'},
    {h:'Sotuvlar',n:1,k:'count'},{h:'Qaytarish',n:1,f:x=>f(x.returns)+' <span class="muted small">('+x.rcount+')</span>'}],r.employees,20,'emp',x=>whoM(x.name))}
    ${SRC('MoySklad → Прибыльность → по сотрудникам, '+uz(r.day),msList('demand',r.day))}</div>
  <h2>Kim nima qildi <span class="pill gray">hujjatlar soni</span></h2><div class="card">${table(
    [{h:'Xodim',k:'name'}].concat(r.acts.map(a=>({h:a[1],n:1,f:x=>x[a[0]]?`<b>${x[a[0]]}</b><div class="muted small">${f(x[a[0]+'_sum'])}</div>`:'<span class="muted">—</span>'}))),r.activity,20,'act',x=>whoM(x.name))}
    <div class="src">Manba: MoySklad hujjatlari, ${uz(r.day)} · ${r.acts.map(a=>MS(msList(a[0],r.day),a[1]+' ↗')).join(' · ')}</div></div>

function status(due,today){ if(!due) return ['none','Muddatsiz','gray'];
  const d=(new Date(due)-new Date(today))/864e5;
  if(d<0) return ['over','Muddati o\'tgan','red']; if(d===0) return ['today','Bugun','orange'];
  if(d<=3) return ['soon','1–3 kun','orange']; if(d<=7) return ['week','7 kungacha','blue']; return ['later','7 kundan keyin','green'];}
const SC={over:'#f04438',today:'#f79009',soon:'#fdb022',week:'#2f7cf6',later:'#12b76a',none:'#c3cad8'};

function sellerStats(){
  const by={};
  N.customers.forEach(c=>{const s=by[c.seller]||(by[c.seller]={name:c.seller,debt:0,n:0,parts:{over:0,today:0,soon:0,week:0,later:0,none:0}});
    s.debt+=c.debt; s.n++; c.docs.forEach(x=>{s.parts[status(x.due,N.today)[0]]+=x.amount;});});
  return Object.values(by).sort((a,b)=>b.debt-a.debt);
}
function segBar(p,total){return '<div class="seg">'+Object.keys(SC).map(k=>p[k]?`<span style="width:${p[k]/total*100}%;background:${SC[k]}" title="${f(p[k])}"></span>`:'').join('')+'</div>';}

  const top=`<div class="bar"><h1>Nasiya</h1><span class="muted small">Yangilandi: ${N.updated} · har 5 daqiqada</span>
   <div class="tabs" style="background:#e9edfb">${[['home','Bosh sahifa'],['cal','Kalendar'],['rep','Bugungi hisobot']].map(v=>`<button style="color:var(--ink)" class="${NV.view===v[0]||(NV.view==='seller'&&v[0]==='home')?'on':''}" onclick="NV={view:'${v[0]}'};render()">${v[1]}</button>`).join('')}</div>
   <button class="btn light" id="nref">Yangilash</button></div>${N.error?'<div class="err">Oxirgi yangilashda xato: '+esc(N.error)+'</div>':''}`;

  const off=(first.getUTCDay()+6)%7, mn=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'][m-1];
  let h=`<div class="bar"><button class="btn light" onclick="shiftM(-1)">←</button><b style="font-size:18px">${mn} ${y}</b><button class="btn light" onclick="shiftM(1)">→</button>
   <span class="legend"><span><b style="background:#12b76a"></b>Keldi</span><span><b style="background:#f79009"></b>Kelishi kerak</span></span></div><div class="cal">`;
  ['Du','Se','Ch','Pa','Ju','Sh','Ya'].forEach(d=>h+=`<div class="h">${d}</div>`);
  for(let i=0;i<off;i++) h+='<div class="d e"></div>';
  for(let d=1;d<=nd;d++){const k=`${calMonth}-${String(d).padStart(2,'0')}`, x=N.days[k]||{};
    h+=`<div class="d ${k===N.today?'t':''}" onclick="dayInfo('${k}')"><b>${d}</b>${x.income?`<div class="inc">+${f(x.income)}</div>`:''}${x.due?`<div class="due">${f(x.due)}</div>`:''}</div>`;}
  return h+'</div><div id="dayinfo"></div>';
}
function shiftM(n){let [y,m]=calMonth.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}calMonth=`${y}-${String(m).padStart(2,'0')}`;render();}
function dayInfo(k){
  const x=N.days[k]||{income:0,due:0,items:[]}, pays=(N.payers||{})[k]||[];
  $('#dayinfo').innerHTML=`<h2>${dd(k)} · keldi <span class="inc">${f(x.income)}</span> · kelishi kerak edi <span class="due">${f(x.due)}</span></h2>
   <div class="card">${table([{h:'Mijoz',f:i=>L(msCo(i.cid),esc(i.client))},{h:'Sotuvchi',k:'seller'},{h:'Otgruzka',f:i=>L(msDoc('demand',i.id),esc(i.doc))},{h:'Summa',n:1,f:i=>f(i.amount)},{h:'Shu kuni to\'ladi',n:1,f:i=>i.paid_that_day?'<span class="inc">'+f(i.paid_that_day)+'</span>':'—'},{h:'Holat',f:i=>(i.open?'<span class="pill red">qarzda</span>':'<span class="pill green">yopilgan</span>')+(i.exact?'':' <span class="pill gray">taxminiy</span>')}],x.items||[],50)}</div>
   <h2>Shu kuni to'laganlar</h2><div class="card">${table([{h:'Mijoz',f:i=>L(msCo(i.cid),esc(i.client))},{h:'Sotuvchi',k:'seller'},{h:'Summa',n:1,f:i=>f(i.amount)}],pays.sort((a,b)=>b.amount-a.amount),30)}</div>`;
  $('#dayinfo').scrollIntoView({behavior:'smooth'});
}
function nReport(){
  const t=N.today, x=N.days[t]||{items:[]}, pays=(N.payers||{})[t]||[], by={};
  const S=n=>by[n]||(by[n]={name:n,due:0,got:0,paid:0,items:[]});
  (x.items||[]).forEach(i=>{const s=S(i.seller); s.due+=i.amount; s.got+=Math.min(i.paid_that_day||0,i.amount); s.items.push(i);});
  pays.forEach(p=>{S(p.seller).paid+=p.amount;});
  const rows=Object.values(by).sort((a,b)=>b.due-a.due);
  let h=`<div class="note">Har kuni 18:25 dagi hisobot: har bir sotuvchi bo'yicha bugun <b>kelishi kerak</b>, <b>keldi</b> va <b>kelmadi</b>. Kelmagan qism ertangi rejaga qo'shiladi.</div>
  <div class="card">${table([{h:'Sotuvchi',k:'name'},{h:'Kelishi kerak',n:1,f:s=>f(s.due)},{h:'Keldi (muddatlilardan)',n:1,f:s=>'<span class="inc">'+f(s.got)+'</span>'},{h:'Kelmadi → ertaga',n:1,f:s=>'<span class="down">'+f(Math.max(s.due-s.got,0))+'</span>'},{h:'Bugun jami tushum',n:1,f:s=>f(s.paid)}],rows,30)}</div>
  <h2>Bugun kelmaganlar</h2><div class="card">${table([{h:'Mijoz',f:i=>L(msCo(i.cid),esc(i.client))},{h:'Sotuvchi',k:'seller'},{h:'Otgruzka',f:i=>L(msDoc('demand',i.id),esc(i.doc))},{h:'Kutilgan',n:1,f:i=>f(i.amount)},{h:'Keldi',n:1,f:i=>f(i.paid_that_day)}],(x.items||[]).filter(i=>(i.paid_that_day||0)<i.amount),50)}</div>`;
  return h;
}
load(); setInterval(async()=>{N=await getJ('api/nasiya'); if(TAB==='nasiya' && NV.view!=='cal') render();},300000);
setInterval(async()=>{if(D&&D.report) return; D=await getJ('api/daily'); if(TAB==='daily'&&!$('#mod').classList.contains('open')) render();},15000);
setInterval(async()=>{const x=await getJ('api/live'); const ch=!LV||!LV.data||!x.data||x.data.at!==LV.data.at; LV=x;
  if(ch&&TAB==='daily'&&!$('#mod').classList.contains('open')) render();},60000);
</script>
