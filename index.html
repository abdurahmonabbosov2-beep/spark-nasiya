<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Plus nasiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --paper:#FFFFFF; --ink:#182635; --muted:#5D6B7A; --line:#D3DAE1;
  --spark:#F2B705;
  --s-over:#C2362B; --s-today:#E0761A; --s-soon:#D9A400; --s-week:#2F6DB0; --s-later:#2C8A57; --s-none:#8A96A3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand span{display:inline-block;width:10px;height:10px;background:var(--spark);border-radius:2px;margin-right:8px;transform:rotate(45deg)}
.upd{color:var(--muted);font-size:13px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* Asosiy blok: umumiy qarz va holat chizig'i */
.hero{margin:22px 0 28px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .total{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .total small{font-size:.4em;font-weight:600;color:var(--muted);margin-left:6px}
.strip{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:16px;background:var(--line)}
.strip div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.legend button{background:none;border:0;padding:2px 0;color:var(--ink);display:flex;align-items:center;gap:6px}
.legend button.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}

.panel{background:var(--paper);border-radius:10px;padding:18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #EEF1F4;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#F5F7F9}
.tscroll{overflow-x:auto}

.sellers{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.seller{background:var(--paper);border-radius:10px;padding:16px;border:1px solid transparent;text-align:left;color:var(--ink);display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center}
.seller:hover{border-color:var(--ink)}
.donut{width:86px;height:86px;border-radius:50%;position:relative}
.donut::after{content:"";position:absolute;inset:16px;background:var(--paper);border-radius:50%}
.seller h3{margin:0 0 2px;font-size:16px}
.seller .amt{font-weight:700;font-size:18px}
.seller .meta{color:var(--muted);font-size:13px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.prog div{height:100%;background:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;margin-bottom:12px;background:#fff}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head h3{margin:0;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.day{background:#F5F7F9;border:1px solid transparent;border-radius:8px;min-height:78px;padding:6px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;font-size:12px}
.day:hover{border-color:var(--ink)}
.day .d{font-weight:700;font-size:14px}
.day.today{background:#FFF4CC;border-color:var(--spark)}
.day.empty{visibility:hidden}
.day .k{color:var(--muted)}
.day .ok{color:var(--s-later);font-weight:600}
.day .bad{color:var(--s-over);font-weight:600}

.detail{margin-top:16px}
.detail h3{margin:0 0 4px}
.err{background:#FBE9E7;color:var(--s-over);padding:12px 14px;border-radius:8px;margin:16px 0}
.empty-msg{color:var(--muted);padding:20px 0}
@media (max-width:640px){ .day{min-height:58px;font-size:10px} .day .d{font-size:12px} .seller{grid-template-columns:64px 1fr} .donut{width:64px;height:64px} .donut::after{inset:12px} }
@media (prefers-reduced-motion:no-preference){ .strip div{transition:width .5s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span></span>Spark Plus nasiya</div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="upd" id="upd">Yuklanmoqda…</span>
      <button class="btn ghost" id="refresh">Yangilash</button>
    </div>
  </header>
  <div id="error"></div>

  <section class="hero">
    <div class="lbl">Mijozlarning umumiy qarzi</div>
    <div class="total" id="total">—</div>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="report" aria-selected="true">Bugungi hisobot</button>
    <button role="tab" data-tab="sellers" aria-selected="false">Sotuvchilar</button>
    <button role="tab" data-tab="all" aria-selected="false">Barcha qarzdorlar</button>
    <button role="tab" data-tab="cal" aria-selected="false">Kalendar</button>
  </nav>
  <main id="view"></main>
</div>

<script>
const ST = [
  {k:'over',  t:"Muddati o'tgan",     c:'var(--s-over)'},
  {k:'today', t:'Bugun',              c:'var(--s-today)'},
  {k:'soon',  t:'1–3 kun qoldi',      c:'var(--s-soon)'},
  {k:'week',  t:'4–7 kun qoldi',      c:'var(--s-week)'},
  {k:'later', t:'8+ kun qoldi',       c:'var(--s-later)'},
  {k:'none',  t:'Muddat yozilmagan',  c:'var(--s-none)'},
];
const stOf = d => d.daysLeft===null?'none':d.daysLeft<0?'over':d.daysLeft===0?'today':d.daysLeft<=3?'soon':d.daysLeft<=7?'week':'later';
const stInfo = k => ST.find(s=>s.k===k);
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const som = n => fmt(n)+" so'm";
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : '—';
const addDays = (s,n) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

let D=null, tab='report', hidden=new Set(), selSeller=null, calMonth=null, selDay=null, q='';

async function load(){
  try{
    const r = await fetch('api/data'); D = await r.json();
    document.getElementById('error').innerHTML = D.error ? `<div class="err">Xato: ${esc(D.error)}</div>` : '';
    if(!D.ready){ document.getElementById('upd').textContent='Ma\'lumot olinmoqda…'; setTimeout(load,5000); return; }
    D.debtors.forEach(d=>d.st=stOf(d));
    if(!calMonth) calMonth = D.today.slice(0,7);
    const t = new Date(D.updatedAt);
    document.getElementById('upd').textContent = 'Yangilandi '+t.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tashkent'});
    render();
  }catch(e){ document.getElementById('error').innerHTML=`<div class="err">Serverga ulanib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.</div>`; }
}

function visible(){ return D.debtors.filter(d=>!hidden.has(d.st)); }

function renderHero(){
  const all = D.debtors, tot = all.reduce((s,d)=>s+d.debt,0);
  document.getElementById('total').innerHTML = fmt(tot)+`<small>so'm · ${all.length} mijoz</small>`;
  const sums = ST.map(s=>({...s, sum: all.filter(d=>d.st===s.k).reduce((a,d)=>a+d.debt,0), n: all.filter(d=>d.st===s.k).length}));
  document.getElementById('strip').innerHTML = sums.filter(s=>s.sum>0).map(s=>`<div title="${s.t}: ${som(s.sum)}" style="width:${s.sum/tot*100}%;background:${s.c}"></div>`).join('');
  document.getElementById('legend').innerHTML = sums.map(s=>`<button data-st="${s.k}" class="${hidden.has(s.k)?'off':''}"><i class="dot" style="background:${s.c}"></i>${s.t}: <b>${som(s.sum)}</b> (${s.n})</button>`).join('');
  document.querySelectorAll('#legend button').forEach(b=>b.onclick=()=>{ hidden.has(b.dataset.st)?hidden.delete(b.dataset.st):hidden.add(b.dataset.st); render(); });
}

function chip(d){ const s=stInfo(d.st);
  const txt = d.daysLeft===null ? 'Muddat yo\'q' : d.daysLeft<0 ? `${-d.daysLeft} kun o'tdi` : d.daysLeft===0 ? 'Bugun' : `${d.daysLeft} kun qoldi`;
  return `<span class="chip" style="background:${s.c}">${txt}</span>`; }

function debtTable(list, showSeller=true){
  if(!list.length) return `<div class="empty-msg">Bu ro'yxatda qarzdor yo'q.</div>`;
  return `<div class="tscroll"><table><thead><tr><th>Mijoz</th>${showSeller?'<th>Sotuvchi</th>':''}<th class="n">Qarz</th><th>Muddat</th><th>Holat</th><th>Otgruzka</th></tr></thead><tbody>`+
    list.map(d=>`<tr><td><b>${esc(d.name)}</b></td>${showSeller?`<td>${esc(d.seller)}</td>`:''}<td class="n"><b>${som(d.debt)}</b></td><td>${dmy(d.due)}${d.term!==null?`<div class="upd">${d.term} kunlik</div>`:''}</td><td>${chip(d)}</td><td class="upd">${esc(d.doc||'—')}</td></tr>`).join('')+
    `</tbody></table></div>`;
}

// Sotuvchi bo'yicha prognoz: oxirgi 30 kunda kelishi kerak bo'lgandan qancha keldi
function sellerStats(){
  const from = addDays(D.today,-30), m = {};
  const get = n => m[n] ||= {name:n, debt:0, n:0, byst:{}, due30:0, paid30:0};
  for(const d of visible()){ const s=get(d.seller); s.debt+=d.debt; s.n++; s.byst[d.st]=(s.byst[d.st]||0)+d.debt; }
  for(const p of D.planned) if(p.date>=from && p.date<D.today){ const a=D.agents[p.agentId]; if(a) get(a.seller).due30+=p.amount; }
  for(const p of D.payments) if(p.date>=from && p.date<D.today){ const a=D.agents[p.agentId]; if(a) get(a.seller).paid30+=p.amount; }
  return Object.values(m).filter(s=>s.n>0).sort((a,b)=>b.debt-a.debt);
}

function viewSellers(){
  const list = sellerStats();
  let h = `<div class="sellers">`+list.map(s=>{
    let acc=0; const grad = ST.filter(x=>s.byst[x.k]).map(x=>{const a=acc/s.debt*360; acc+=s.byst[x.k]; return `${x.c} ${a}deg ${acc/s.debt*360}deg`;}).join(',');
    const rate = s.due30>0 ? Math.min(100,Math.round(s.paid30/s.due30*100)) : null;
    const over = s.byst.over||0;
    return `<button class="seller" data-s="${esc(s.name)}"><div class="donut" style="background:conic-gradient(${grad})"></div><div>
      <h3>${esc(s.name)}</h3><div class="amt">${som(s.debt)}</div>
      <div class="meta">${s.n} mijoz${over?` · muddati o'tgan ${som(over)}`:''}</div>
      <div class="meta" style="margin-top:6px">Undirish (30 kun): <b>${rate===null?'—':rate+'%'}</b></div>
      <div class="prog"><div style="width:${rate||0}%"></div></div></div></button>`;}).join('')+`</div>`;
  if(selSeller){
    const lst = visible().filter(d=>d.seller===selSeller);
    h += `<div class="panel detail"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>${esc(selSeller)} — qarzdorlari</h3><button class="btn ghost" id="closeSel">Yopish</button></div>${debtTable(lst,false)}</div>`;
  }
  return h;
}

function viewAll(){
  const qq=q.toLowerCase(), lst=visible().filter(d=>!qq||d.name.toLowerCase().includes(qq)||d.seller.toLowerCase().includes(qq));
  return `<div class="panel"><input class="search" id="q" placeholder="Mijoz yoki sotuvchi nomi bo'yicha qidirish" value="${esc(q)}">${debtTable(lst)}</div>`;
}

// Bugungi hisobot: kelishi kerak / keldi / kelmadi, kelmagani ertangi rejaga
function viewReport(){
  const T=D.today, TM=addDays(T,1), m={};
  const get = n => m[n] ||= {name:n, need:0, got:0, tomorrow:0};
  for(const p of D.planned){ const a=D.agents[p.agentId]; if(!a) continue;
    if(p.date===T) get(a.seller).need+=p.amount; if(p.date===TM) get(a.seller).tomorrow+=p.amount; }
  for(const p of D.payments){ if(p.date!==T) continue; const a=D.agents[p.agentId]; if(a) get(a.seller).got+=p.amount; }
  const rows = Object.values(m).sort((a,b)=>b.need-a.need);
  const tot = rows.reduce((t,r)=>({need:t.need+r.need,got:t.got+r.got,tm:t.tm+r.tomorrow+Math.max(0,r.need-r.got)}),{need:0,got:0,tm:0});
  if(!rows.length) return `<div class="panel"><div class="empty-msg">Bugun (${dmy(T)}) muddati keladigan nasiya yo'q va to'lov tushmagan.</div></div>`;
  return `<div class="panel"><p class="upd" style="margin-top:0">${dmy(T)} — har kuni 18:25 da shu jadvalni tekshiring. Kelmagan qism ertangi rejaga qo'shiladi.</p><div class="tscroll"><table>
    <thead><tr><th>Sotuvchi</th><th class="n">Kelishi kerak</th><th class="n">Keldi</th><th class="n">Kelmadi</th><th class="n">Ertangi reja</th></tr></thead><tbody>`+
    rows.map(r=>{const miss=Math.max(0,r.need-r.got);return `<tr class="click" data-s="${esc(r.name)}"><td><b>${esc(r.name)}</b></td><td class="n">${som(r.need)}</td><td class="n" style="color:var(--s-later)">${som(r.got)}</td><td class="n" style="color:${miss?'var(--s-over)':'inherit'}"><b>${som(miss)}</b></td><td class="n">${som(r.tomorrow+miss)}</td></tr>`;}).join('')+
    `<tr><td><b>Jami</b></td><td class="n"><b>${som(tot.need)}</b></td><td class="n"><b>${som(tot.got)}</b></td><td class="n"><b>${som(Math.max(0,tot.need-tot.got))}</b></td><td class="n"><b>${som(tot.tm)}</b></td></tr></tbody></table></div></div>`;
}

function viewCal(){
  const [y,mo]=calMonth.split('-').map(Number), first=new Date(Date.UTC(y,mo-1,1)), days=new Date(Date.UTC(y,mo,0)).getUTCDate();
  const lead=(first.getUTCDay()+6)%7, need={}, got={};
  for(const p of D.planned) if(p.date.startsWith(calMonth)) need[p.date]=(need[p.date]||0)+p.amount;
  for(const p of D.payments) if(p.date.startsWith(calMonth)) got[p.date]=(got[p.date]||0)+p.amount;
  const months=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
  let h=`<div class="panel"><div class="cal-head"><button class="btn ghost" id="pm" aria-label="Oldingi oy">‹</button><h3>${months[mo-1]} ${y}</h3><button class="btn ghost" id="nm" aria-label="Keyingi oy">›</button></div><div class="cal">`+
    ['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(w=>`<div class="wd">${w}</div>`).join('')+'<div class="day empty"></div>'.repeat(lead);
  for(let i=1;i<=days;i++){
    const ds=`${calMonth}-${String(i).padStart(2,'0')}`, n=need[ds]||0, g=got[ds]||0, past=ds<=D.today;
    h+=`<button class="day${ds===D.today?' today':''}" data-d="${ds}"><span class="d">${i}</span>${n?`<span class="k">Kerak ${fmt(n)}</span>`:''}${past&&g?`<span class="ok">Keldi ${fmt(g)}</span>`:''}${past&&n>g?`<span class="bad">Kam ${fmt(n-g)}</span>`:''}</button>`;
  }
  h+='</div></div>';
  if(selDay){
    const pl=D.planned.filter(p=>p.date===selDay), py=D.payments.filter(p=>p.date===selDay), past=selDay<=D.today;
    const sn=pl.reduce((s,p)=>s+p.amount,0), sg=py.reduce((s,p)=>s+p.amount,0);
    h+=`<div class="panel detail"><h3>${dmy(selDay)}</h3><p class="upd" style="margin-top:0">Kelishi kerak: <b>${som(sn)}</b>${past?` · Keldi: <b>${som(sg)}</b>`:''}</p>
      <h4 style="margin:12px 0 4px">Shu kunga muddat qo'yilgan otgruzkalar</h4>${pl.length?`<div class="tscroll"><table><thead><tr><th>Mijoz</th><th>Sotuvchi</th><th>Otgruzka</th><th class="n">Summa</th></tr></thead><tbody>${pl.map(p=>{const a=D.agents[p.agentId]||{};return `<tr><td>${esc(a.name)}</td><td>${esc(a.seller)}</td><td class="upd">${esc(p.doc)} (${dmy(p.shipDate)})</td><td class="n">${som(p.amount)}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty-msg">Yo'q</div>`}
      ${past?`<h4 style="margin:16px 0 4px">Tushgan to'lovlar</h4>${py.length?`<div class="tscroll"><table><thead><tr><th>Mijoz</th><th>Sotuvchi</th><th class="n">Summa</th></tr></thead><tbody>${py.map(p=>{const a=D.agents[p.agentId]||{};return `<tr><td>${esc(a.name)}</td><td>${esc(a.seller)}</td><td class="n">${som(p.amount)}</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="empty-msg">To'lov tushmagan</div>`}`:''}</div>`;
  }
  return h;
}

function render(){
  renderHero();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  const v=document.getElementById('view');
  v.innerHTML = tab==='sellers'?viewSellers():tab==='all'?viewAll():tab==='cal'?viewCal():viewReport();
  v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ selSeller=b.dataset.s; tab='sellers'; render(); document.querySelector('.detail')?.scrollIntoView({behavior:'smooth'}); });
  const cs=document.getElementById('closeSel'); if(cs) cs.onclick=()=>{selSeller=null;render();};
  const qi=document.getElementById('q'); if(qi){ qi.oninput=()=>{ q=qi.value; const pos=qi.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); }; }
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ selDay=b.dataset.d; render(); document.querySelector('.detail')?.scrollIntoView({behavior:'smooth'}); });
  const shift=k=>{ const [y,m]=calMonth.split('-').map(Number), d=new Date(Date.UTC(y,m-1+k,1)); calMonth=d.toISOString().slice(0,7); selDay=null; render(); };
  const pm=document.getElementById('pm'); if(pm){ pm.onclick=()=>shift(-1); document.getElementById('nm').onclick=()=>shift(1); }
}

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });
document.getElementById('refresh').onclick=async()=>{ const b=document.getElementById('refresh'); b.disabled=true; b.textContent='Yangilanmoqda…';
  try{ await fetch('api/refresh',{method:'POST'}); }catch(e){} await load(); b.disabled=false; b.textContent='Yangilash'; };
load(); setInterval(load, 5*60*1000);
</script>
</body>
</html>
